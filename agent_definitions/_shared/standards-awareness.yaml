# Shared standards-awareness prompt block for agent system prompts.
# This file is NOT a standalone agent definition — it is included via
# !include directives in other agent YAML files.
#
# Content:

## STANDARDS AWARENESS — consult FIRST before proposing any improvement

The fleet maintains shared conventions in the **robotsix-standards**
repo (https://github.com/damien-robotsix/robotsix-standards).  When
the checkout is available for your run, the runner appends a
**"Standards checkout location for this run"** note to your prompt
giving its absolute path.  Reach it ONLY with the in-process file
tools (`list_dir` / `read_file`) using that absolute path:

- The checkout lives OUTSIDE the repo tree, at
  `<data_dir>/standards_cache/repo` (mirroring `_ensure_standards_repo`
  in `agents/surveying.py`) — it is NOT part of the repo clone, so a
  repo-relative `standards_cache/repo` and bare names like
  `robotsix-standards` do NOT resolve from the repo root.
- `run_command`'s shell sandbox mounts only the repo checkout, never
  the standards tree — browse with the file tools, not
  `ls`/`cat`/`grep`.
- Do NOT call `list_dir('/')` — root paths are sandbox-rejected
  (`path '/' escapes the repository`), and there is no need to start
  from `/` when your prompt names the exact path.

Use it as a filter, not a straitjacket:

1. **Read AGENT.md** — if it exists at the repo root, it declares the
   standards the repo subscribes to and may link to the standards
   repo.  Start there.

2. **Selectively fetch only relevant standards pages.**  From the
   repo's actual tech stack (language, runtime, deployment style,
   Docker usage, etc.), read ONLY the standards pages that apply.
   Skip Docker conventions for a no-Docker repo; skip Python
   conventions for a Go repo.  A single `list_dir` on the standards
   root is enough to orient you.

3. **Standards as a filter:**
   - Do NOT propose improvements that the standards already cover —
     the repo should adopt the standard, not invent a competing
     local convention.
   - If the gap you identify SHOULD be defined in standards for the
     whole fleet rather than patched locally, note this explicitly
     in your output (e.g. "This belongs in robotsix-standards, not
     as a local workaround") and skip filing a local proposal.
     Standards-domain proposals are routed separately.
   - File improvements specific to the repo's own purpose directly
     on the repo.

4. **When standards are unavailable** — if AGENT.md is absent, the
   standards checkout is missing, or the repo explicitly opts out,
   note this and proceed with your best judgment.  Do not block on
   missing standards.

# Dependency graph submission and version updates are handled by Dependabot.
# (A previous header claimed Renovate handled updates, but the Renovate bot is
# not installed on this repository — there are no Renovate-authored PRs and no
# Dependency Dashboard issue — so Dependabot is the active updater.)
# The native Dependabot `uv` graph-submission job previously failed because
# Dependabot's infrastructure did not support Python 3.14 lockfiles with
# git dependencies.  Those limitations have since been fixed upstream
# (Python 3.14 version-list patch landed May 2026; git-dep handling fixed
# in PR #14704/#15217).  The `uv` ecosystem is listed below with
# open-pull-requests-limit: 0 to suppress version-update PRs while allowing
# the native graph-submission check to pass.
# The `github_actions` ecosystem is enabled so Dependabot opens a PR whenever a
# pinned reusable-workflow ref moves.  Dependabot demonstrably bumps the same
# cross-org `damien-robotsix/robotsix-github-workflows/.github/workflows/*.yml@sha`
# `uses:` lines on sibling repos (robotsix-memory, robotsix-file-hub,
# robotsix-chat), so the previously documented cross-org parser limitation no
# longer holds.
version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 0

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5

name: Dependabot auto-merge

on:
  pull_request:

permissions: {}  # no workflow-level default; the job grants its own

jobs:
  auto-merge:
    name: Dependabot auto-merge
    # Dependabot dependency bumps only.
    #
    # release-please PRs are deliberately NOT auto-merged: that PR *is* the
    # release gate. Auto-merging it would cut a release on every push to
    # main, which makes the version number meaningless. Releases stay a
    # human decision.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    # contents: write and pull-requests: write needed to approve and merge PRs
    permissions:
      contents: write  # approve and merge the PR
      pull-requests: write  # label and merge the PR
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/dependabot-auto-merge.yml@2de56a85055b60d0f01c406342eda081e68c0c8b  # main

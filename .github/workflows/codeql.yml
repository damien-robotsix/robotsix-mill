name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 2"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    permissions:
      contents: read
      security-events: write  # upload the CodeQL SARIF to code scanning
    # Shared fleet CodeQL workflow (same as cost-monitor/calendar/auto-mail).
    # Python needs no build; the reusable's autobuild step is a no-op here.
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/codeql.yml@b9388c432eeba3c83f21cc588935cdeea6f8c218  # main
    with:
      languages: python
      config-file: ./.github/codeql/codeql-config.yml

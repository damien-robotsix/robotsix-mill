name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 2"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    permissions:
      contents: read
      security-events: write  # upload the CodeQL SARIF to code scanning
    # Shared fleet CodeQL workflow (same as cost-monitor/calendar/auto-mail).
    # Python needs no build; the reusable's autobuild step is a no-op here.
    # Pinned to github-workflows main after #251 unified the codeql-action
    # init/autobuild/analyze pins on v4.39.1 (never pin older than 92c11fd).
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/codeql.yml@464cc48d10a2f4f71fc267c3a4937bb999bcaed3  # main 2026-10-27
    with:
      languages: python
      config-file: ./.github/codeql/codeql-config.yml

name: Dependency Review

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    permissions:
      contents: read
      pull-requests: write  # comment-summary-in-pr
    # Shared fleet dependency-review workflow (robotsix-github-workflows #252).
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/dependency-review.yml@86a722f2938c1dda343bbf8d3c5989613cbf1794  # v1.5.0
    with:
      fail-on-severity: moderate

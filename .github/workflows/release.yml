name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Docker image publishing (GHCR via shared reusable) ─────────────────

  lint:
    name: Dockerfile lint (hadolint)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      UV_MALWARE_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: sandbox/Dockerfile
          failure-threshold: warning

      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387  # v3.5.0
        with:
          dockerfile: sandbox/proxy/Dockerfile
          failure-threshold: warning

  publish-mill:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: lint
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/docker-release.yml@92c11fd2be7a9ce80bd60208616271326e0fb08a  # main 2026-10-26
    permissions:
      contents: read
      packages: write  # push the image to GHCR
      id-token: write  # OIDC token for the build-provenance attestation
      attestations: write  # publish the build-provenance attestation
      security-events: write  # upload the Trivy scan SARIF to code scanning
    with:
      image-name: ghcr.io/damien-robotsix/robotsix-mill
      # Smoke the published digest: sandbox-contract `gh` and workflow-lint
      # tools (this image is the production sandbox_image), bundled
      # agent_definitions, and readable importlib.metadata version.
      smoke_command: "gh --version && actionlint -version && zizmor --version && uvx --version && python -c 'from robotsix_mill._resources import agent_definitions_dir; assert agent_definitions_dir().is_dir()' && python -c \"from importlib.metadata import metadata; assert metadata('robotsix-mill')['Version']\""

  publish-sandbox:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: lint
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/docker-release.yml@92c11fd2be7a9ce80bd60208616271326e0fb08a  # main 2026-10-26
    permissions:
      contents: read
      packages: write  # push the image to GHCR
      id-token: write  # OIDC token for the build-provenance attestation
      attestations: write  # publish the build-provenance attestation
      security-events: write  # upload the Trivy scan SARIF to code scanning
    with:
      image-name: ghcr.io/damien-robotsix/robotsix-mill-sandbox
      dockerfile: sandbox/Dockerfile
      smoke_command: "gh --version && uv --version"

  publish-proxy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: lint
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/docker-release.yml@92c11fd2be7a9ce80bd60208616271326e0fb08a  # main 2026-10-26
    permissions:
      contents: read
      packages: write  # push the image to GHCR
      id-token: write  # OIDC token for the build-provenance attestation
      attestations: write  # publish the build-provenance attestation
      security-events: write  # upload the Trivy scan SARIF to code scanning
    with:
      image-name: ghcr.io/damien-robotsix/robotsix-mill-sandbox-proxy
      dockerfile: sandbox/proxy/Dockerfile
      # context is not exposed by the reusable; sandbox/proxy/Dockerfile
      # uses repo-root-relative COPY paths so context: . (the reusable
      # default) works correctly.

  smoke-sandbox:
    # The reusable's smoke_command covers `gh`/`uv` presence on the
    # published digest, but cannot set `--user`, so the non-root uv
    # assertion stays inline.
    name: Smoke test sandbox image (non-root uv)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: publish-sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read  # pull the just-published image from GHCR for the smoke test
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image ref
        id: ref
        # The reusable does not expose an image-digest output, so we
        # construct the tag from branch/tag name. docker/metadata-action
        # in the reusable generates:
        #   branch → `main` (type=ref,event=branch)
        #   tag    → `1.2.3` (type=semver,pattern={{version}}, v stripped)
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
            echo "image=ghcr.io/damien-robotsix/robotsix-mill-sandbox:${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "image=ghcr.io/damien-robotsix/robotsix-mill-sandbox:main" >> "$GITHUB_OUTPUT"
          fi

      - name: Assert uv reachable as non-root runtime user
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: docker run --rm --user 1000:1000 -e HOME=/tmp --entrypoint uv "$IMAGE" --version

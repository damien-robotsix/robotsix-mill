# CRITICAL: This workflow pushes commits and creates PRs, so it MUST use a
# caller-supplied credential that is NOT the default GITHUB_TOKEN.
# GitHub deliberately suppresses workflow runs for events created by
# GITHUB_TOKEN to prevent recursion — CI workflows will NOT fire on the
# bump PR if you pass GITHUB_TOKEN.
#
# This workflow delegates to the shared robotsix-github-workflows/bump.yml
# reusable workflow (bump-mode: deps). The shared workflow mints an
# installation token from the GitHub App (RELEASE_APP_PRIVATE_KEY) per run;
# no expiry/rotation, bot identity.

name: Dependency Bump
on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:
permissions: {}
jobs:
  bump:
    name: Bump uv.lock
    # The shared bump job declares contents/pull-requests: write; a `uses:`
    # job inherits nothing from the caller's `permissions: {}`, so without
    # this grant GitHub refuses the run at startup (startup_failure, no
    # jobs, no logs — 2026-10-19 run 39222210148).
    permissions:
      contents: write       # push the bump branch
      pull-requests: write  # create the bump PR
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/bump.yml@86a722f2938c1dda343bbf8d3c5989613cbf1794  # v1.5.0
    with:
      bump-mode: "deps"
      packages: "robotsix-llmio robotsix-board robotsix-yaml-config robotsix-modules"
      default-branch: "main"
      bump-branch: "deps/bump-uv-lock"
      app-id: ${{ vars.RELEASE_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

# Deny-by-default at the workflow level; scope permissions per job.
permissions: {}

jobs:
  deploy:
    # A caller-job permissions map REPLACES the called workflow's token
    # scopes — anything unlisted is zeroed, and an unmet request fails the
    # run at startup (startup_failure, no jobs, no logs). The spine now
    # deploys via the Pages Actions, so grant exactly what it needs.
    permissions:
      contents: read   # the spine's build job checks out this repo
      pages: write     # the spine's deploy job publishes the Pages artifact
      id-token: write  # OIDC auth for actions/deploy-pages
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-docs.yml@86a722f2938c1dda343bbf8d3c5989613cbf1794  # v1.5.0
    with:
      docs-install-args: "--group docs"
      # Bare minor (matching ci.yml): a hard patch pin breaks whenever
      # ubuntu-latest migrates to a new OS image, because
      # actions/python-versions does not rebuild old patches for new images.
      # The griffelib 2.0.2 incompatibility that motivated the old 3.14.5
      # pin (#1150) is fixed by the upgraded docs toolchain in uv.lock.
      python-version: "3.14"
      uv-version: "0.8.15"
      retries: "4"

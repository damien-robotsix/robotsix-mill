name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

# Deny-by-default at the workflow level; scope permissions per job.
permissions: {}

jobs:
  deploy:
    # A caller-job permissions map REPLACES the called workflow's token
    # scopes — anything unlisted is zeroed, and an unmet request fails the
    # run at startup (startup_failure, no jobs, no logs). The spine now
    # deploys via the Pages Actions, so grant exactly what it needs.
    permissions:
      contents: read   # the spine's build job checks out this repo
      pages: write     # the spine's deploy job publishes the Pages artifact
      id-token: write  # OIDC auth for actions/deploy-pages
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-docs.yml@188518bece972d7d5f1c4e2a0f2226d2526dc0fa
    with:
      docs-install-args: "--group docs"
      # Pin to a concrete 3.14.x patch: a bare "3.14" lets setup-python
      # auto-resolve the newest patch from its manifest, which has drifted
      # ahead of the locked griffelib 2.0.2 and broke mkdocstrings
      # collection on every push. 3.14.5 is the latest patch verified
      # compatible with the locked docs toolchain.
      python-version: "3.14.5"
      uv-version: "0.8.15"
      retries: "4"

name: Lint Workflows

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    permissions:
      contents: read
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/lint-workflows.yml@86a722f2938c1dda343bbf8d3c5989613cbf1794  # v1.5.0
    with:
      run-actionlint: true
      run-zizmor: true

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    permissions:
      contents: read
      security-events: write  # shared python-ci.yml uploads scan SARIF to code scanning
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-ci.yml@86a722f2938c1dda343bbf8d3c5989613cbf1794  # v1.5.0
    with:
      python-version: "3.14"
      uv-version: "0.12.0"
      # `dev` is now a PEP 735 dependency-group, not a package extra; it is
      # pulled in automatically by `[tool.uv] default-groups = ["dev"]` on
      # every `uv sync`, so only the genuine `tracing` extra is listed here.
      install-extras: "tracing"
      cov-package: "robotsix_mill"
      coverage-threshold: 80
      pytest-args: -n auto
      bandit-severity: "medium"
      mypy-advisory: true
      # Ignored advisories live in the single-source `.audit-ignore`
      # (the `audit-ignore-file` default), shared with security-audit.yml.

  # ── PR-time image build + blocking Trivy gate (CRITICAL/HIGH, fixable) ──
  # Mirrors the post-merge publish jobs in release.yml so a Dockerfile
  # change that breaks the build or adds a CVE fails the PR, not `main`.
  # Trivy reads the repo's `.trivyignore` from the checkout.
  docker-pr-scan-mill:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      security-events: write  # upload the Trivy scan SARIF to code scanning
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/docker-pr-scan.yml@92c11fd2be7a9ce80bd60208616271326e0fb08a  # main 2026-10-26
    with:
      image-name: ghcr.io/damien-robotsix/robotsix-mill
      dockerfile: Dockerfile
      smoke_command: "gh --version && actionlint -version && zizmor --version && uvx --version && python -c 'from robotsix_mill._resources import agent_definitions_dir; assert agent_definitions_dir().is_dir()' && python -c \"from importlib.metadata import metadata; assert metadata('robotsix-mill')['Version']\""

  docker-pr-scan-sandbox:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      security-events: write  # upload the Trivy scan SARIF to code scanning
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/docker-pr-scan.yml@92c11fd2be7a9ce80bd60208616271326e0fb08a  # main 2026-10-26
    with:
      image-name: ghcr.io/damien-robotsix/robotsix-mill-sandbox
      dockerfile: sandbox/Dockerfile
      smoke_command: "gh --version && uv --version"

  docker-pr-scan-proxy:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      security-events: write  # upload the Trivy scan SARIF to code scanning
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/docker-pr-scan.yml@92c11fd2be7a9ce80bd60208616271326e0fb08a  # main 2026-10-26
    with:
      image-name: ghcr.io/damien-robotsix/robotsix-mill-sandbox-proxy
      dockerfile: sandbox/proxy/Dockerfile

  mill-specific:
    name: Mill-specific checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_MALWARE_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          # Tests read git history (diff vs base ref) but never push;
          # drop the persisted token so it cannot leak via artifacts.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: "0.12.0"

      - name: Install dev deps
        # `dev` is a PEP 735 dependency-group pulled in automatically via
        # `[tool.uv] default-groups = ["dev"]`; only `tracing` stays an extra.
        run: uv sync --locked --extra tracing
        env:
          UV_PROJECT_ENVIRONMENT: system

      - name: mypy (strict, gating on new errors vs baseline)
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: scripts/mypy_gate.sh

      - name: Reject bare string TicketKind literals
        # Mill-domain check (TicketKind) — kept here, not in the shared
        # python-ci.yml that every member repo calls.
        run: python scripts/check_kind_literals.py

      - name: Validate module taxonomy
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: |
          uv run robotsix-modules validate docs/modules.yaml
          uv run python scripts/validate_module_paths.py

      - name: Check file registration
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: |
          uv run python -c "
          import subprocess, sys, yaml
          from pathlib import Path
          from robotsix_modules.validation.registration import check_registration

          taxonomy = yaml.safe_load(Path('docs/modules.yaml').read_text())
          result = subprocess.run(['git', 'ls-files', '-s'],
                                  capture_output=True, text=True)
          if result.returncode != 0:
              print('git ls-files failed', file=sys.stderr)
              sys.exit(2)
          tracked = []
          for line in result.stdout.splitlines():
              if not line.strip():
                  continue
              mode = line[:6]
              path = line.split('\t', 1)[1] if '\t' in line else ''
              if mode != '160000' and path:
                  tracked.append(path)

          # Skip files that no longer exist on disk — when an agent deletes
          # a file but git-rm hasn't run yet, the file is still tracked by
          # git but should not be flagged as unclassified.  This is the
          # equivalent of a hypothetical --allow-missing-example flag.
          tracked = [p for p in tracked if Path(p).exists()]

          findings = check_registration(taxonomy, Path('.'),
                                        tracked_files=tracked)
          if findings:
              for f in findings:
                  print(f.message, file=sys.stderr)
              sys.exit(1)
          print('All tracked files are properly registered.')
          "

      - name: Vulture (dead code)
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: uv run vulture --ignore-decorators "@field_validator,@model_validator" src/ vulture_whitelist.py

      - name: deptry (dependency hygiene)
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: uv run deptry .

      - name: Validate config sync
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: uv run python scripts/check_config_sync.py

      - name: Validate config docs sync
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: uv run python scripts/check_config_docs_sync.py

      - name: Validate _BUILTIN_KINDS cross-sync
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: uv run python scripts/check_builtin_kinds.py

      - name: Validate SourceKind ↔ frontend parity
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: uv run python scripts/check_sourcekind_frontend_parity.py

      - name: Check config-standard footprint
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: uv run python scripts/check_config_standard_footprint.py

      - name: Validate config.schema.json sync
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: uv run python scripts/emit_config_schema.py --check

      - name: Check workflow pinning
        run: |
          ! grep -nE 'uses:\s*\S+\.github/workflows/[^@]*@(main|master|latest|v[0-9]+)' \
            .github/workflows/*.yml

      - name: Check shell completions are up-to-date
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: |
          uv run python scripts/gen_completions.py
          git diff --exit-code contrib/completions/ || {
            echo "contrib/completions/ is out of date."
            echo "Run 'make completions' and commit the result."
            exit 1
          }
      - name: Check for un-generated migrations (model/migration drift)
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: |
          DB_URL="sqlite:///${RUNNER_TEMP}/drift-check.db"
          sed -i "s|^sqlalchemy\.url = .*|sqlalchemy.url = $DB_URL|" alembic.ini
          uv run alembic upgrade head
          uv run alembic check

      - name: Lint shell scripts (shellcheck)
        run: shellcheck --severity=warning scripts/*.sh dev/*.sh entrypoint.sh

      # `uv sync` installs from the live source tree, so nothing above ever
      # exercises Hatchling's wheel/sdist assembly.  Until now the first
      # actual build was the Docker image in release.yml — post-merge and
      # post-tag, so a packaging regression escaped every pre-merge gate.
      - name: Build sdist + wheel
        run: uv build

      - name: Check the wheel ships its force-included resources
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: uv run python scripts/check_wheel_contents.py

  hadolint:
    permissions:
      contents: read
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/lint-dockerfile.yml@86a722f2938c1dda343bbf8d3c5989613cbf1794  # v1.5.0
    with:
      dockerfiles: "Dockerfile sandbox/Dockerfile sandbox/proxy/Dockerfile"
      failure-threshold: warning

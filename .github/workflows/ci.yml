name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    permissions:
      contents: read
      security-events: write
    uses: damien-robotsix/robotsix-github-workflows/.github/workflows/python-ci.yml@e94a9aad6c4d6753c860520ba49b6a94a59ceb55
    with:
      python-version: "3.14"
      uv-version: "0.12.0"
      # `dev` is now a PEP 735 dependency-group, not a package extra; it is
      # pulled in automatically by `[tool.uv] default-groups = ["dev"]` on
      # every `uv sync`, so only the genuine `tracing` extra is listed here.
      install-extras: "tracing"
      cov-package: "robotsix_mill"
      coverage-threshold: 80
      pytest-args: -n auto
      bandit-severity: "medium"
      mypy-advisory: true
      # CVE ignores mirroring security-audit.yml:
      #   PYSEC-2025-183 (pyjwt): disputed advisory — key strength is the
      #     caller's responsibility; mill supplies ≥2048-bit GitHub App keys.
      #   MAL-2026-4750 (fastapi): undocument "fastar" dep in fastapi[standard];
      #     mill depends on fastapi without extras, so the malicious dep is
      #     never installed.  Advisory since withdrawn (retained for docs).
      #   GHSA-9xwg-3r6f-jcx2 (pymdown-extensions): XSS in Arithmatex,
      #     fixed in 10.14; mill's lock pins 10.21.3 — above the fix version.
      #     pymdown-extensions is a transitive docs-only dependency, never
      #     shipped or served to users.
      #   GHSA-jwv3-5hgf-82ww (cryptography): duplicate self-signed
      #     intermediates can cause exponential path-building; fixed in 49.0.0.
      #     Pinned 50.0.0 via uv.lock; advisory DB may still flag.
      #   GHSA-m2h6-j472-rp4c (cryptography): verifier accepts wildcard DNS
      #     names allowing escape from permittedSubtrees; fixed in 49.0.0.
      #     Pinned 50.0.0 via uv.lock; advisory DB may still flag.
      #   GHSA-g6cj-pr64-35w5 (cryptography): PKCS#7 EnvelopedData decryption
      #     exposes a Bleichenbacher oracle; fixed in 50.0.0.
      #     Pinned 50.0.0 via uv.lock; advisory DB may still flag.
      #   GHSA-fp3f-mc75-235c (pypdf): large memory usage for large
      #     /ToUnicode streams; fixed in 6.15.0 (2026-08-06). Pinned
      #     6.15.0 via uv.lock; advisory DB may still flag.
      #   GHSA-fwg2-594c-jp42 (pypdf): long runtimes for large CID font
      #     width ranges; fixed in 6.15.0 (2026-08-06). Pinned 6.15.0
      #     via uv.lock; advisory DB may still flag.
      audit-ignore: "PYSEC-2025-183, MAL-2026-4750, GHSA-9xwg-3r6f-jcx2, GHSA-jwv3-5hgf-82ww, GHSA-m2h6-j472-rp4c, GHSA-g6cj-pr64-35w5, GHSA-fp3f-mc75-235c, GHSA-fwg2-594c-jp42"

  mill-specific:
    runs-on: ubuntu-latest
    env:
      UV_MALWARE_CHECK: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0
          # Tests read git history (diff vs base ref) but never push;
          # drop the persisted token so it cannot leak via artifacts.
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: "0.12.0"

      - name: Install dev deps
        # `dev` is a PEP 735 dependency-group pulled in automatically via
        # `[tool.uv] default-groups = ["dev"]`; only `tracing` stays an extra.
        run: uv sync --locked --extra tracing
        env:
          UV_PROJECT_ENVIRONMENT: system

      - name: mypy (strict, gating on new errors vs baseline)
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: |
          uv run mypy src/ --strict | uv run mypy-baseline filter --baseline-path mypy-baseline.txt

      - name: Reject bare string TicketKind literals
        # Mill-domain check (TicketKind) — kept here, not in the shared
        # python-ci.yml that every member repo calls.
        run: python scripts/check_kind_literals.py

      - name: Validate module taxonomy
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: |
          uv run robotsix-modules validate docs/modules.yaml
          uv run python scripts/validate_module_paths.py

      - name: Check file registration
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: |
          uv run python -c "
          import subprocess, sys, yaml
          from pathlib import Path
          from robotsix_modules.validation.registration import check_registration

          taxonomy = yaml.safe_load(Path('docs/modules.yaml').read_text())
          result = subprocess.run(['git', 'ls-files', '-s'],
                                  capture_output=True, text=True)
          if result.returncode != 0:
              print('git ls-files failed', file=sys.stderr)
              sys.exit(2)
          tracked = []
          for line in result.stdout.splitlines():
              if not line.strip():
                  continue
              mode = line[:6]
              path = line.split('\t', 1)[1] if '\t' in line else ''
              if mode != '160000' and path:
                  tracked.append(path)

          # Skip files that no longer exist on disk — when an agent deletes
          # a file but git-rm hasn't run yet, the file is still tracked by
          # git but should not be flagged as unclassified.  This is the
          # equivalent of a hypothetical --allow-missing-example flag.
          tracked = [p for p in tracked if Path(p).exists()]

          findings = check_registration(taxonomy, Path('.'),
                                        tracked_files=tracked)
          if findings:
              for f in findings:
                  print(f.message, file=sys.stderr)
              sys.exit(1)
          print('All tracked files are properly registered.')
          "

      - name: Vulture (dead code)
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: uv run vulture --ignore-decorators "@field_validator,@model_validator" src/ vulture_whitelist.py

      - name: deptry (dependency hygiene)
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: uv run deptry .

      - name: Validate config sync
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: uv run python scripts/check_config_sync.py

      - name: Validate config docs sync
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: uv run python scripts/check_config_docs_sync.py

      - name: Validate _BUILTIN_KINDS cross-sync
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: uv run python scripts/check_builtin_kinds.py

      - name: Validate SourceKind ↔ frontend parity
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: uv run python scripts/check_sourcekind_frontend_parity.py

      - name: Check config-standard footprint
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: uv run python scripts/check_config_standard_footprint.py

      - name: Validate config.schema.json sync
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: uv run python scripts/emit_config_schema.py --check

      - name: Check workflow pinning
        run: |
          ! grep -nE 'uses:\s*\S+\.github/workflows/[^@]*@(main|master|latest|v\d+)' \
            .github/workflows/*.yml

      - name: Validate workflow permissions
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: uv run python scripts/validate_workflow_permissions.py

      - name: Check shell completions are up-to-date
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: |
          uv run python scripts/gen_completions.py
          git diff --exit-code contrib/completions/ || {
            echo "contrib/completions/ is out of date."
            echo "Run 'make completions' and commit the result."
            exit 1
          }
      - name: Check for un-generated migrations (model/migration drift)
        env:
          UV_PROJECT_ENVIRONMENT: system
        run: |
          DB_URL="sqlite:///${RUNNER_TEMP}/drift-check.db"
          sed -i "s|^sqlalchemy\.url = .*|sqlalchemy.url = $DB_URL|" alembic.ini
          uv run alembic upgrade head
          uv run alembic check

      - name: Lint shell scripts (shellcheck)
        run: shellcheck --severity=warning scripts/*.sh dev/*.sh entrypoint.sh

      - name: Lint main Dockerfile (hadolint)
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5  # v3.3.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Lint sandbox Dockerfile (hadolint)
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5  # v3.3.0
        with:
          dockerfile: sandbox/Dockerfile
          failure-threshold: warning

      - name: Lint sandbox proxy Dockerfile (hadolint)
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5  # v3.3.0
        with:
          dockerfile: sandbox/proxy/Dockerfile
          failure-threshold: warning
